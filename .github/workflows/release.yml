name: Build installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: ubuntu-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MULTIPLANE_NO_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: FFmpeg and Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg xvfb
      - name: Renderer dependencies
        run: node tools/ci-run.mjs renderer-install . npm ci
      - name: Desktop dependencies and tests
        uses: ./.github/actions/desktop-test
      - name: Package for the native host architecture
        run: node tools/ci-run.mjs desktop-dist app npm run dist
      - name: Verify installed application (Windows and macOS)
        if: runner.os != 'Linux'
        run: node tools/ci-run.mjs packaged-test app npm run verify:packaged
      - name: Verify AppImage (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node tools/ci-run.mjs packaged-test app npm run verify:packaged
      - name: Installers, logs and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            app/release/*.exe
            app/release/*.dmg
            app/release/*.AppImage
            out/ci/
            out/013-packaged/
          if-no-files-found: warn
          retention-days: 14
